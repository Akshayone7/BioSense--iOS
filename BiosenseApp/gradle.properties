org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Gradle 8.7 caps out at JDK 21. If your system default is JDK 22+ (e.g. the
# Groovy build-script analyser errors with "Unsupported class file major
# version N"), uncomment the line below and point it at your local JDK 17.
# Default (commented): Gradle will use the JDK Android Studio ships with (17+),
# which is correct for every normal setup.
#   Windows example: org.gradle.java.home=C:/Program Files/Java/jdk-17
#   macOS example:   org.gradle.java.home=/Library/Java/JavaVirtualMachines/jdk-17.jdk/Contents/Home
#   Linux example:   org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
